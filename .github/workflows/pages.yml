name: Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Seed synthetic data
        run: >
          uv run python tools/local_data_manager.py --action seed
          --project-ids 101,102,103 --count 1000 --inject-errors --seed 42
          --dashboard-url-base https://bleviet.github.io/gitlab-pulse/demo/

      - name: Process data
        run: uv run python tools/local_data_manager.py --action process

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build demo frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build:demo

      - name: Assemble demo into docs
        run: |
          mkdir -p docs/demo
          cp -R frontend/dist-demo/. docs/demo/
          uv run python tools/export_demo_payload.py --output docs/demo/demo-data/dashboard.json

      - uses: actions/configure-pages@v5

      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
