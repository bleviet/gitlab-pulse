<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GitLab Pulse</title>
    <link rel="icon" href="/favicon.ico?v=3" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/static/logo.svg?v=3" />
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png?v=3" />
    <link rel="icon" type="image/png" sizes="64x64" href="/static/favicon.png?v=3" />
    <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png?v=3" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("pulse_theme");
          var theme = saved === "light" || saved === "dark" ? saved : "dark";
          document.documentElement.dataset.theme = theme;
          var colorTheme = localStorage.getItem("pulse_color_theme");
          if (colorTheme && colorTheme !== "bahonavi") {
            document.documentElement.dataset.colorTheme = colorTheme;
          }
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
